<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Games Tracker — API Docs</title>
    <link rel="stylesheet" href="swagger-ui.css" />
    <style>
      body { margin: 0; }
      /* Topbar con la paleta dark/neón de la app principal. */
      .topbar {
        background: linear-gradient(90deg, #0b0d17, #1c2138);
        border-bottom: 1px solid #2e3553;
        box-shadow: 0 0 18px rgba(124, 58, 237, 0.2);
      }
      .topbar .download-url-wrapper { display: none; }
      .topbar .topbar-wrapper a span {
        color: #a855f7 !important;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <!-- Bundles servidos desde el propio backend (embebidos en el binario Go). -->
    <script src="swagger-ui-bundle.js"></script>
    <script src="swagger-ui-standalone-preset.js"></script>
    <script>
      // La spec se sirve desde la raíz del backend, no desde /swagger/.
      window.ui = SwaggerUIBundle({
        url: "/openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset.slice(1),
        ],
        layout: "StandaloneLayout",
        deepLinking: true,
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: true,
      });
    </script>
  </body>
</html>
