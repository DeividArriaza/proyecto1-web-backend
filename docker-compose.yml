# docker-compose para el stack completo de Series Tracker.
# Vive en el repo del backend. El servicio `frontend` apunta al repo hermano
# `../games-tracker-frontend`, que debe estar clonado al mismo nivel.

services:
  db:
    image: postgres:16-alpine
    container_name: games-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Puerto del host distinto al estándar 5432 para no chocar con instalaciones locales.
      - "${DB_HOST_PORT:-15432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # init.sql se ejecuta una sola vez, cuando el volumen está vacío.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: games-tracker-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT:-8787}
    ports:
      - "${API_HOST_PORT:-8787}:${API_PORT:-8787}"
    volumes:
      # Persistencia de las imágenes subidas por los usuarios.
      - api_uploads:/app/uploads

  frontend:
    build:
      # El contexto apunta al repo hermano del frontend.
      context: ../games-tracker-frontend
      dockerfile: Dockerfile
    container_name: games-tracker-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-4567}:80"

volumes:
  db_data:
  api_uploads:
